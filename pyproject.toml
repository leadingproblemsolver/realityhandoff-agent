[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reality-handoff-agent"
version = "0.3.0"
description = "Proof-carrying LangGraph agent that reads, acts on, verifies, and hands off DataHub context through MCP."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Reality Handoff Agent contributors"}]
dependencies = [
  "langgraph>=1.2,<2",
  "langchain>=1.3,<2",
  "langchain-mcp-adapters>=0.3,<0.4",
  "langchain-openai>=1.4,<2",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.8", "langgraph-cli[inmem]>=0.4.31"]

[project.scripts]
reality-handoff = "reality_handoff.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reality_handoff"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
